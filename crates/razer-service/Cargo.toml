[package]
name = "razer-service"
version.workspace = true
edition.workspace = true

[dependencies]
razer-catalog.workspace = true
razer-ipc.workspace = true
razer-model.workspace = true
razer-platform.workspace = true
anyhow.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
md5.workspace = true
razer-device.workspace = true
razer-discovery.workspace = true
razer-hid.workspace = true
razer-storage.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
tokio.workspace = true
uuid.workspace = true
tungstenite.workspace = true
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
log.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
zeromq = { version = "=0.6.0", default-features = false, features = ["tokio-runtime", "ipc-transport"] }
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation",
  "Storage_Streams",
  "Win32_System_WinRT",
  "Win32_System_Wmi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }
windows-future = "=0.2.1"
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_IO",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Security",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Networking_WinSock",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Display",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
] }
