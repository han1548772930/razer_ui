[package]
name = "razer_ui"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "razer_ui"
path = "app/main.rs"

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"

[dependencies]
razer-app.workspace = true

[workspace.dependencies]
razer-agent = { path = "crates/razer-agent" }
razer-dashboard = { path = "crates/razer-dashboard" }
razer-tray = { path = "crates/razer-tray" }
razer-settings = { path = "crates/razer-settings" }
razer-discovery = { path = "crates/razer-discovery" }
razer-platform = { path = "crates/razer-platform" }
razer-ipc = { path = "crates/razer-ipc" }
razer-app-pages = { path = "crates/razer-app-pages" }
razer-app = { path = "crates/razer-app" }
razer-assets = { path = "crates/razer-assets" }
razer-catalog = { path = "crates/razer-catalog" }
razer-resources = { path = "crates/razer-resources" }
razer-resource-db = { path = "crates/razer-resource-db" }
razer-device = { path = "crates/razer-device" }
razer-hid = { path = "crates/razer-hid" }
razer-i18n = { path = "crates/razer-i18n" }
razer-model = { path = "crates/razer-model" }
razer-pages = { path = "crates/razer-pages" }
razer-service = { path = "crates/razer-service" }
razer-shell = { path = "crates/razer-shell" }
razer-state = { path = "crates/razer-state" }
razer-storage = { path = "crates/razer-storage" }
razer-widgets = { path = "crates/razer-widgets" }
gpui-kit = { version = "0.7", features = ["gpui-fast"] }
anyhow = "1"
log = { version = "0.4.34", features = ["std"] }
async-channel = "2"
chrono = "0.4.45"
# KSNI supplies the Linux tray without requiring a second GTK event loop.
tray-icon = { version = "0.26.1", default-features = false, features = [
  "ksni",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
roxmltree = "0.21.1"
semver = "1"
regex = "1"
unicode-segmentation = "1.13.3"
unicode-linebreak = "0.1.5"
unicode-script = "0.5.8"
uuid = { version = "1", features = ["v4"] }
md5 = "0.8"
libloading = "0.9"
# Portable Feature Report backend. Protocol and logical device routing stay in Rust.
# Linux uses hidraw without a libudev development-library requirement; Windows
# and macOS use hidapi's statically linked system backends, not Razer DLLs.
# hidapi 2.6.7's windows-native feature lacks get_input_report; retain control
# Input support. See crates/razer-hid/WINDOWS_BACKEND.md for the MSVC profile fix.
hidapi = { version = "=2.6.7", default-features = false, features = [
  "linux-native-basic-udev",
  "macos-shared-device",
] }
# 产品词表来自本地目录库；rust-i18n 与 GPUI 共享当前界面语言。
rust-i18n = "4"


raw-window-handle = "0.6.2"
windows-sys = "0.61.2"
bytes = "=1.12.1"
h2 = "=0.4.20"
http = "=1.5.0"
tokio = { version = "=1.53.2", features = ["rt", "io-util", "sync", "time", "net", "macros"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

# MSVC 14.42 D8050 rejects hidapi's C -Z7 debug records in this environment.
# Limit the workaround to hidapi; application/Rust debug information remains.
[profile.dev.package.hidapi]
debug = 0

[profile.test.package.hidapi]
debug = 0

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
