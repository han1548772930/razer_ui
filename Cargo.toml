[package]
name = "razer_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7"
anyhow = "1"
async-channel = "2"
chrono = "0.4.45"
# KSNI supplies the Linux tray without requiring a second GTK event loop.
tray-icon = { version = "0.26.0", default-features = false, features = [
  "ksni",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
md5 = "0.8"
libloading = "0.8"
# 与 gpui-component 内部使用的是同一套 i18n（`rust_i18n::i18n!` + `t!`）。
rust-i18n = "4"


[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }


[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
